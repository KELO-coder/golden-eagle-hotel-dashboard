name: Collect market intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and summarize market intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/collect-market-intelligence.mjs
      - name: Commit updated intelligence data
        run: |
          if git diff --quiet -- data/market-intelligence.json; then
            echo "No intelligence changes to commit"
            exit 0
          fi
          git config user.name "golden-eagle-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-intelligence.json
          git commit -m "Update market intelligence"
          git push
